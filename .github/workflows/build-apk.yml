name: Build & Publish RIFT APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK to RIFT.apk
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RIFT.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RIFT-APK
          path: RIFT.apk

      - name: Publish to GitHub Releases (Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "RIFT — Latest Test Build"
          body: "Automated APK build from latest AI Studio push. Tap **RIFT.apk** below on your Android phone to download and install."
          files: RIFT.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
