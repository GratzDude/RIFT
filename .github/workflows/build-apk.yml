name: Build & Publish RIFT APK + Play Store AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Persistent Upload Keystore, Export upload_certificate.pem, Firebase Config & Web Client ID
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          RIFT_GOOGLE_SERVICES_JSON: ${{ secrets.RIFT_GOOGLE_SERVICES_JSON }}
          RIFT_FIREBASE_API_KEY: ${{ secrets.RIFT_FIREBASE_API_KEY }}
          RIFT_WEB_CLIENT_ID: ${{ secrets.RIFT_WEB_CLIENT_ID }}
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=RIFT Game,O=Syndicate Studios,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f debug.keystore
            git commit -m "chore: save persistent Android keystore [skip ci]" || true
            git push origin HEAD:main || true
          fi
          echo "Active signing keystore fingerprints:"
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" || true
          cp debug.keystore app/debug.keystore || true
          cp debug.keystore my-upload-key.jks || true
          cp debug.keystore app/my-upload-key.jks || true

          rm -f upload_certificate.pem
          if keytool -exportcert -rfc -keystore debug.keystore -alias androiddebugkey -storepass android -file upload_certificate.pem 2>/dev/null; then
            echo "Exported PEM public certificate upload_certificate.pem from debug.keystore (alias: androiddebugkey)."
          elif [ -f "my-upload-key.jks" ] && keytool -exportcert -rfc -keystore my-upload-key.jks -alias upload -storepass "${STORE_PASSWORD:-android}" -file upload_certificate.pem 2>/dev/null; then
            echo "Exported PEM public certificate upload_certificate.pem from my-upload-key.jks (alias: upload)."
          else
            DETECTED_ALIAS=$(keytool -list -keystore debug.keystore -storepass android | sed -n 's/^\([^,]*\),.*/\1/p' | head -n 1)
            keytool -exportcert -rfc -keystore debug.keystore -alias "${DETECTED_ALIAS:-androiddebugkey}" -storepass android -file upload_certificate.pem
            echo "Exported PEM public certificate upload_certificate.pem from debug.keystore (alias: ${DETECTED_ALIAS:-androiddebugkey})."
          fi
          if [ ! -s "upload_certificate.pem" ]; then
            echo "ERROR: upload_certificate.pem was not generated or is empty."
            exit 1
          fi
          echo "=== upload_certificate.pem Public Certificate Fingerprints (Google Play Upload Key Reset) ==="
          keytool -printcert -file upload_certificate.pem | grep -E "Owner:|Issuer:|Serial number:|Valid from:|SHA1:|SHA256:" || true

          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib

          gs_path = pathlib.Path("app/google-services.json")
          raw_secret = (
              os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
              or os.environ.get("RIFT_GOOGLE_SERVICES_JSON", "").strip()
          )
          web_cid = os.environ.get("RIFT_WEB_CLIENT_ID", "").strip()
          api_key = os.environ.get("RIFT_FIREBASE_API_KEY", "").strip()

          if raw_secret:
              decoded = raw_secret
              if not raw_secret.startswith("{"):
                  try:
                      decoded = base64.b64decode(raw_secret).decode("utf-8")
                  except Exception:
                      decoded = raw_secret
              parsed = json.loads(decoded)
              gs_path.write_text(json.dumps(parsed, indent=2), encoding="utf-8")
              print("Materialized app/google-services.json from repository secret.")
          elif not gs_path.exists() and api_key:
              effective_cid = web_cid or ("000000000000-placeholder." + "apps.googleusercontent.com")
              synthesized = {
                  "project_info": {
                      "project_number": "65019105126",
                      "project_id": "gen-lang-client-0921275231",
                      "storage_bucket": "gen-lang-client-0921275231.firebasestorage.app",
                  },
                  "client": [
                      {
                          "client_info": {
                              "mobilesdk_app_id": "1:65019105126:android:25130544cd475e527cc2a7",
                              "android_client_info": {"package_name": "com.game.rift"},
                          },
                          "oauth_client": [
                              {
                                  "client_id": effective_cid,
                                  "client_type": 3,
                              }
                          ],
                          "api_key": [{"current_key": api_key}],
                          "services": {
                              "appinvite_service": {
                                  "other_platform_oauth_client": [
                                      {"client_id": effective_cid, "client_type": 3}
                                  ]
                              }
                          },
                      }
                  ],
                  "configuration_version": "1",
              }
              gs_path.write_text(json.dumps(synthesized, indent=2), encoding="utf-8")
              print("Synthesized app/google-services.json for com.game.rift from RIFT_FIREBASE_API_KEY.")

          if gs_path.exists():
              data = json.loads(gs_path.read_text(encoding="utf-8"))
              clients = data.get("client", [])
              has_rift_pkg = any(
                  c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.game.rift"
                  for c in clients
              )
              if not has_rift_pkg and clients:
                  clients[0].setdefault("client_info", {}).setdefault("android_client_info", {})["package_name"] = "com.game.rift"
                  for oc in clients[0].get("oauth_client", []):
                      if "android_info" in oc:
                          oc["android_info"]["package_name"] = "com.game.rift"
              has_type_3 = False
              for c in clients:
                  if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.game.rift":
                      for oc in c.get("oauth_client", []):
                          if oc.get("client_type") == 3:
                              has_type_3 = True
                              if web_cid:
                                  oc["client_id"] = web_cid
                      if not has_type_3 and web_cid:
                          c.setdefault("oauth_client", []).append({"client_id": web_cid, "client_type": 3})
                          has_type_3 = True
                      for oc in c.get("services", {}).get("appinvite_service", {}).get("other_platform_oauth_client", []):
                          if oc.get("client_type") == 3 and web_cid:
                              oc["client_id"] = web_cid
              gs_path.write_text(json.dumps(data, indent=2), encoding="utf-8")
              fallback_xml = pathlib.Path("app/src/main/res/values/auth_fallback.xml")
              if has_type_3:
                  if fallback_xml.exists():
                      fallback_xml.unlink()
              else:
                  fallback_cid = web_cid or ("000000000000-placeholder." + "apps.googleusercontent.com")
                  fallback_xml.parent.mkdir(parents=True, exist_ok=True)
                  fallback_xml.write_text(
                      '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
                      f'    <string name="default_web_client_id" translatable="false">{fallback_cid}</string>\n'
                      '</resources>\n',
                      encoding="utf-8",
                  )
          else:
              fallback_cid = web_cid or ("000000000000-placeholder." + "apps.googleusercontent.com")
              fallback_xml = pathlib.Path("app/src/main/res/values/auth_fallback.xml")
              fallback_xml.parent.mkdir(parents=True, exist_ok=True)
              fallback_xml.write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
                  f'    <string name="default_web_client_id" translatable="false">{fallback_cid}</string>\n'
                  '</resources>\n',
                  encoding="utf-8",
              )
              print("WARNING: app/google-services.json not present; set GOOGLE_SERVICES_JSON secret in GitHub for cloud Google Sign-In.")
          PY

          if [ ! -f "app/src/main/res/values/firebase_applet_config.xml" ]; then
            mkdir -p app/src/main/res/values
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="firestore_database_id" translatable="false">ai-studio-android-e89169ef-97d3-4e29-8d52-8ef180c62ff3</string>\n</resources>\n' > app/src/main/res/values/firebase_applet_config.xml
          fi

      - name: Set Package ID to com.game.rift, Verify versionCode >= 108 & Point Release Signing to Keystore
        run: |
          sed -i 's/applicationId = "[^"]*"/applicationId = "com.game.rift"/g' app/build.gradle.kts
          sed -i 's/signingConfigs.getByName("release")/signingConfigs.findByName("debugConfig") ?: signingConfigs.getByName("debug")/g' app/build.gradle.kts
          sed -i 's/signingConfigs.findByName("release")/signingConfigs.findByName("debugConfig") ?: signingConfigs.getByName("debug")/g' app/build.gradle.kts
          sed -i 's/signingConfigs\["release"\]/signingConfigs.findByName("debugConfig") ?: signingConfigs.getByName("debug")/g' app/build.gradle.kts
          APP_ID=$(sed -n 's/.*applicationId *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          APP_VERSION_CODE=$(sed -n 's/.*versionCode *= *\([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          APP_VERSION_NAME=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ "$APP_ID" != "com.game.rift" ]; then
            echo "ERROR: Expected applicationId com.game.rift for Play Console build, got '$APP_ID'"
            exit 1
          fi
          if [ -z "$APP_VERSION_CODE" ] || [ "$APP_VERSION_CODE" -lt 108 ]; then
            echo "ERROR: Expected versionCode >= 108 in app/build.gradle.kts, got '$APP_VERSION_CODE'"
            exit 1
          fi
          echo "RIFT_APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "RIFT_VERSION_CODE=$APP_VERSION_CODE" >> "$GITHUB_ENV"
          echo "RIFT_VERSION_NAME=$APP_VERSION_NAME" >> "$GITHUB_ENV"
          echo "Verified RIFT Play Console build applicationId=$APP_ID versionCode=$APP_VERSION_CODE versionName=$APP_VERSION_NAME"

      - name: Build Debug APK & Signed Release AAB
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
        run: |
          set -o pipefail
          gradle assembleDebug bundleRelease --no-daemon 2>&1 | tee gradle-build.log

      - name: Bundle Live Codebase & Build Log for Gemini Review
        if: always()
        run: |
          {
            echo "# RIFT — Full Codebase Snapshot (Build #${{ github.run_number }})"
            echo "## 0. Latest Gradle Build Output (Tail)"
            echo '```text'
            tail -n 120 gradle-build.log 2>/dev/null || echo "No gradle log found"
            echo '```'
            echo "## 1. Directory Tree"
            echo '```text'
            find app public index.html build.gradle.kts settings.gradle.kts -maxdepth 6 -not -path "*/build/*" -not -name "google-services.json" 2>/dev/null | sort
            echo '```'
            echo "## 2. Source Code Files"
            find app public index.html build.gradle.kts settings.gradle.kts -type f \
              \( -name "*.kt" -o -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.kts" -o -name "*.xml" -o -name "*.json" \) \
              -not -path "*/build/*" -not -name "google-services.json" 2>/dev/null | sort | while read -r f; do
                echo ""
                echo "### FILE: $f"
                echo '```'
                cat "$f"
                echo ""
                echo '```'
            done
          } > RIFT-codebase.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f RIFT-codebase.md
          git commit -m "chore: update RIFT-codebase.md snapshot (Build #${{ github.run_number }})" || true
          git push -f origin HEAD:refs/heads/snapshot

      - name: Collect APK, Play Store AAB & Public Upload Certificate
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RIFT.apk
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          cp "$AAB_PATH" RIFT-release.aab
          ls -lh RIFT.apk RIFT-release.aab upload_certificate.pem

      - name: Upload APK, AAB, Upload Certificate & Codebase Snapshot to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RIFT-Builds
          path: |
            RIFT.apk
            RIFT-release.aab
            RIFT-codebase.md
            upload_certificate.pem

      - name: Publish APK, Play Store AAB & Codebase Snapshot to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "RIFT — Build #${{ env.RIFT_VERSION_CODE }} (v${{ env.RIFT_VERSION_NAME }} • com.game.rift)"
          body: |
            - **Direct Phone Install:** Tap **RIFT.apk** below.
            - **Google Play Console Upload:** Download **RIFT-release.aab** (`com.game.rift`, Version Code `${{ env.RIFT_VERSION_CODE }}`, Version Name `${{ env.RIFT_VERSION_NAME }}`).
            - **Full Codebase Bundle for Gemini:** `RIFT-codebase.md`
          files: |
            RIFT.apk
            RIFT-release.aab
            RIFT-codebase.md
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
