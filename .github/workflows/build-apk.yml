name: Build & Publish RIFT APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Missing Keystore & Web Client ID
        run: |
          # 1. Generate the missing debug.keystore expected by build.gradle.kts
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp debug.keystore app/debug.keystore || true

          # 2. Inject default_web_client_id so AuthScreen.kt compiles cleanly
          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/auth_ fallback.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="default_web_client_id" translatable="false">000000000000-placeholder.apps.googleusercontent.com</string>
          </resources>
          EOF
          mv "app/src/main/res/values/auth_ fallback.xml" app/src/main/res/values/auth_fallback.xml

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
        run: |
          gradle assembleDebug --no-daemon

      - name: Rename APK to RIFT.apk
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RIFT.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RIFT-APK
          path: RIFT.apk

      - name: Publish to GitHub Releases (Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "RIFT — Latest Test Build"
          body: "Automated APK build from latest AI Studio push. Tap **RIFT.apk** below on your Android phone to download and install."
          files: RIFT.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
